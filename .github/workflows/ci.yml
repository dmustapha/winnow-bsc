name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: winnow-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --fetch-retries=5 --fetch-timeout=120000
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
